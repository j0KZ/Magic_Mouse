name: build

# El proyecto se escribe en un entorno Linux sin toolchain de Swift, así que
# esta es la única compilación real que existe. Si esto pasa a verde, el código
# compila, se empaqueta y reconoce los gestos de las grabaciones de Fixtures/
# igual que el día que se midieron. Lo que se *sienta* bien en la mano sigue
# siendo otra pregunta, y esa solo la responde tener el mouse delante.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Entorno
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Compilar (debug, con warnings a la vista)
        run: swift build -v 2>&1 | tail -80

      - name: Tests
        # Reproducen las grabaciones reales de Fixtures/ contra el reconocedor.
        # Es lo más cerca del hardware que llega un runner sin Magic Mouse.
        run: swift test

      - name: Compilar y empaquetar (release)
        # Ad-hoc explícito: el runner no tiene el certificado de firma, y una
        # firma ad-hoc a propósito es mejor que una que se decide sola.
        run: MMG_FIRMA=adhoc ./build.sh

      - name: Comprobar el bundle
        run: |
          test -x build/MagicMouseGestures.app/Contents/MacOS/MagicMouseGestures
          test -x build/mmg-probe
          test -f build/MagicMouseGestures.app/Contents/Resources/AppIcon.icns
          test -f build/MagicMouseGestures.app/Contents/Resources/en.lproj/Localizable.strings
          test -f build/MagicMouseGestures.app/Contents/Resources/es.lproj/Localizable.strings
          codesign --verify --verbose build/MagicMouseGestures.app
          plutil -lint build/MagicMouseGestures.app/Contents/Info.plist

      - name: mmg-probe arranca y no explota
        # El runner no tiene Magic Mouse, así que --devices debe salir limpio
        # o quejarse de que no hay dispositivos. Lo que no puede es crashear.
        run: ./build/mmg-probe --help
